<style>
/* Layout: a cashbook — sticky header with role tabs, summary tiles over ledger tables; RTL throughout */
:root{
  --bg:#f2f4f6; --surface:#ffffff; --sunken:#e9edf1; --fg:#16202b; --muted:#5b6876; --line:#d9e0e7;
  --accent:#1f4f7a; --accent-ink:#ffffff; --accent-soft:#e3ecf5;
  --in:#1b7650; --in-soft:#e2f2ea; --out:#b2412c; --out-soft:#f8e6e2; --cust:#86650c; --cust-soft:#f6efd9;
  --display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --r:10px; --sky1:#d9ebfb; --sky2:#fff1dc; --sun:#f5a524; --moon:#e9e4c8; --hero-fg:#16202b;
  --c-present:#1b7650; --c-late:#b7791f; --c-notyet:#2f6db3; --c-absent:#b2412c; --c-leave:#7b5bb5;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --surface:#161f28; --sunken:#111921; --fg:#e5ecf2; --muted:#93a2b0; --line:#26323e;
  --accent:#86b6e2; --accent-ink:#0e141a; --accent-soft:#1c2c3c;
  --in:#5fc898; --in-soft:#15302a; --out:#ee8c78; --out-soft:#3a2020; --cust:#e2bd5e; --cust-soft:#342b14; --sky1:#1a2747; --sky2:#0f1622; --sun:#f5a524; --moon:#efe8c6; --hero-fg:#eef3f8; --c-present:#5fc898; --c-late:#e8b04b; --c-notyet:#7fb0f0; --c-absent:#ee8c78; --c-leave:#b9a0ec; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#161f28; --sunken:#111921; --fg:#e5ecf2; --muted:#93a2b0; --line:#26323e;
  --accent:#86b6e2; --accent-ink:#0e141a; --accent-soft:#1c2c3c;
  --in:#5fc898; --in-soft:#15302a; --out:#ee8c78; --out-soft:#3a2020; --cust:#e2bd5e; --cust-soft:#342b14; --sky1:#1a2747; --sky2:#0f1622; --sun:#f5a524; --moon:#efe8c6; --hero-fg:#eef3f8; --c-present:#5fc898; --c-late:#e8b04b; --c-notyet:#7fb0f0; --c-absent:#ee8c78; --c-leave:#b9a0ec; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
h2{font-size:1.15rem} h3{font-size:1rem}
.num,td.n,.kpi b{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:36px;height:36px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.1rem}
.brand b{font-family:var(--display);font-size:1.05rem;display:block;line-height:1.2}
.brand small{color:var(--muted);font-size:.78rem}
.who{display:flex;align-items:center;gap:10px;font-size:.88rem;color:var(--muted);flex-wrap:wrap;justify-content:flex-end}
.who strong{color:var(--fg)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:0;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 12px;border-bottom:2px solid transparent;color:var(--muted);white-space:nowrap;font-weight:500}
.tabs button[aria-current="true"]{color:var(--accent);border-bottom-color:var(--accent)}

main{padding-block:20px 60px;display:grid;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.muted{color:var(--muted)} .small{font-size:.85rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:2px}
.kpi span{color:var(--muted);font-size:.85rem}
.kpi b{font-family:var(--display);font-size:1.45rem;font-weight:600;text-align:right}
.kpi small{color:var(--muted);font-size:.78rem}
.kpi.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.main span,.kpi.main small{color:inherit;opacity:.85}
.pos{color:var(--in)} .neg{color:var(--out)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:.9rem}
.btn:hover{background:var(--sunken)}
.primary{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:8px;padding:9px 18px;font-weight:600}
.primary:disabled{opacity:.6;cursor:wait}
.link{border:0;background:none;color:var(--accent);padding:2px 4px;font-size:.85rem}
.link.danger{color:var(--out)}
.link.confirm{background:var(--out);color:#fff;border-radius:6px;padding:2px 8px}

.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:500}
.seg button[aria-pressed="true"][data-k="income"]{background:var(--in-soft);border-color:var(--in);color:var(--in)}
.seg button[aria-pressed="true"][data-k="expense"]{background:var(--out-soft);border-color:var(--out);color:var(--out)}
.seg button[aria-pressed="true"][data-k="custody"],.seg button[aria-pressed="true"][data-k="return"]{background:var(--cust-soft);border-color:var(--cust);color:var(--cust)}

.form{display:grid;gap:12px;max-width:640px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
label{display:grid;gap:4px;font-size:.88rem;color:var(--muted);font-weight:500}
input,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--fg);font-size:.95rem;min-width:0}
input:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hint{margin:0;font-size:.84rem;color:var(--muted);background:var(--sunken);border-radius:8px;padding:8px 10px}
.hint:empty{display:none}
.editing{background:var(--cust-soft);color:var(--cust);border-radius:8px;padding:8px 12px;font-size:.9rem}

.tbl{overflow-x:auto;margin-inline:-4px}
table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:560px}
th{font-weight:500;color:var(--muted);text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);font-size:.8rem;white-space:nowrap}
td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.n{text-align:left;white-space:nowrap}
td .sub{display:block;color:var(--muted);font-size:.8rem}
tfoot td{font-weight:600;border-bottom:0;border-top:2px solid var(--line)}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.78rem;font-weight:500;white-space:nowrap}
.k-income{background:var(--in-soft);color:var(--in)} .k-expense{background:var(--out-soft);color:var(--out)}
.k-custody,.k-return{background:var(--cust-soft);color:var(--cust)}
.empty{padding:22px 10px;text-align:center;color:var(--muted);font-size:.9rem}

.bars{display:grid;gap:10px}
.bar{display:grid;gap:4px}
.bar-top{display:flex;justify-content:space-between;gap:8px;font-size:.88rem}
.track{height:8px;background:var(--sunken);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:var(--out);border-radius:99px}

.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px}
.pcard{text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px}
.pcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.pcard .nm{font-family:var(--display);font-weight:600}
.pcard dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0;font-size:.85rem}
.pcard dt{color:var(--muted)} .pcard dd{margin:0;text-align:left;font-variant-numeric:tabular-nums}
.pcard .bal{border-top:1px dashed var(--line);padding-top:6px;font-weight:600}

.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px;margin-bottom:12px}

.login{max-width:440px;margin:40px auto;display:grid;gap:16px}
.plist{display:grid;gap:8px}
.plist button{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 14px;text-align:right}
.plist button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.plist small{color:var(--muted)}
.err{color:var(--out);font-size:.88rem;margin:0}
.err:empty{display:none}

.settings-row{display:grid;grid-template-columns:1.6fr 1fr auto;gap:8px;align-items:end;padding-block:10px;border-bottom:1px solid var(--line)}
@media (max-width:640px){.settings-row{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 10px;font-size:.85rem;background:var(--bg)}
.chip button{border:0;background:none;color:var(--muted);padding:0 6px;font-size:1rem;line-height:1}
.inline{display:flex;gap:8px;margin-top:10px} .inline input{flex:1}

tr.has-det td{border-bottom:0}
tr.det td{padding-top:0;background:var(--bg)}
.adjs{list-style:none;margin:6px 0;padding:0;display:grid;gap:4px;font-size:.86rem}
.adjs li{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.score{display:inline-flex;align-items:center;gap:6px}
.meter{width:56px;height:6px;border-radius:99px;background:var(--sunken);overflow:hidden;display:inline-block}
.meter i{display:block;height:100%;background:var(--accent)}
tr.sel td{background:var(--accent-soft)}
input[type="time"]{direction:ltr}
.perms{grid-column:1/-1;display:grid;gap:8px;background:var(--bg);border-radius:8px;padding:10px 12px}
.perm{color:var(--fg);padding:4px 10px;gap:6px;cursor:pointer}
.perm input{width:auto}
.perm:has(input:disabled){opacity:.7;cursor:default}
.alert{background:var(--out-soft);color:var(--out);border:1px solid var(--out);border-radius:var(--r);padding:12px 14px;font-size:.92rem}
.sec-grid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px}
@media (max-width:640px){.sec-grid{grid-template-columns:1fr}}

/* tones: the signed-in person's palette */
:root[data-tone="f"]{--accent:#a33a6f;--accent-soft:#f8e3ee;--accent-ink:#fff;--sky1:#fbe1ec;--sky2:#fff0e3}
:root[data-theme="dark"][data-tone="f"]{--accent:#f29ac4;--accent-soft:#3b1e2e;--accent-ink:#1b0e15;--sky1:#2c1838;--sky2:#120f1d}
:root[data-tone="m"]{--accent:#1d5d8f;--accent-soft:#e0edf7;--accent-ink:#fff;--sky1:#d6eaf8;--sky2:#e9f6ef}
:root[data-theme="dark"][data-tone="m"]{--accent:#7fbbe9;--accent-soft:#17293a;--accent-ink:#0b1520;--sky1:#142a45;--sky2:#0d161f}
body{transition:background-color .4s}
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em}
.tabs button{display:inline-flex;align-items:center;gap:6px}
.tabs button .ic{opacity:.75}
.tabs button[aria-current="true"] .ic{opacity:1}
.who{gap:8px}
.who-name{display:grid;line-height:1.25;text-align:right}.who-name small{color:var(--muted);font-size:.75rem}
.icon-btn{padding:7px 9px;display:inline-grid;place-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;transition:transform .12s,background .15s}
.btn:active,.primary:active{transform:scale(.97)}
.primary{display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s,filter .15s,box-shadow .2s}
.primary:hover{filter:brightness(1.06);box-shadow:0 6px 18px -8px var(--accent)}
.h-ic{display:inline-flex;align-items:center;gap:8px}
.h-ic .ic{color:var(--accent)}
.kpi-l{display:flex;align-items:center;gap:8px}
.kpi-ic{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-style:normal}
.kpi.main .kpi-ic{background:rgba(255,255,255,.18);color:inherit}
.kpi{transition:transform .2s,box-shadow .2s}
.kpi:hover{transform:translateY(-2px);box-shadow:0 10px 24px -16px rgba(0,0,0,.35)}
@media (max-width:640px){.hide-sm{display:none}}

/* avatars */
.av{--s:32px;width:var(--s);height:var(--s);border-radius:50%;display:inline-grid;place-items:center;flex:none;overflow:hidden;font-family:var(--display);font-weight:600;font-size:calc(var(--s)*.38);background:var(--accent-soft);color:var(--accent);box-shadow:0 0 0 2px var(--surface)}
.av img{width:100%;height:100%;object-fit:cover}
.av-f{background:#f9dcea;color:#a33a6f}.av-m{background:#d9e9f7;color:#1d5d8f}
:root[data-theme="dark"] .av-f{background:#3b1e2e;color:#f29ac4}:root[data-theme="dark"] .av-m{background:#17293a;color:#7fbbe9}
.who-cell{display:inline-flex;align-items:center;gap:10px;min-width:0}
.who-cell b{font-weight:600}
.pc-head{display:flex;align-items:center;gap:10px}
.pcard{transition:transform .2s,box-shadow .2s,border-color .2s}
.pcard:hover{transform:translateY(-2px);box-shadow:0 12px 26px -18px rgba(0,0,0,.4)}
h2#fileTitle{gap:12px}

/* hero */
.hero{position:relative;overflow:hidden;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:18px;padding:20px 22px;border-radius:18px;background:linear-gradient(120deg,var(--sky1),var(--sky2));color:var(--hero-fg)}
.hero h1{font-size:clamp(1.35rem,3.6vw,1.9rem);font-weight:700;margin:2px 0 4px}
.hero p{margin:0;opacity:.85}
.hero-greet{font-size:.9rem;opacity:.8}
.hero-side{display:flex;align-items:center;gap:14px}
.hero-clock{display:grid;text-align:left;line-height:1.2}
.hero-clock b{font-family:var(--display);font-size:1.6rem;font-weight:600}
.hero-clock span{font-size:.8rem;opacity:.8}
.hero-art{width:76px;height:76px}
.art{width:100%;height:100%}
.sun .rays{fill:var(--sun);opacity:.55;transform-origin:60px 60px;animation:spin 40s linear infinite}
.sun circle{fill:var(--sun)}
.moon .m{fill:var(--moon)}
.moon .st{fill:var(--moon);animation:tw 3s ease-in-out infinite}
.moon .s2{animation-delay:1s}.moon .s3{animation-delay:2s}
.hero-art{animation:float 6s ease-in-out infinite}
.bday{display:inline-flex;align-items:center;gap:6px;font-weight:600}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media (max-width:640px){.hero{grid-template-columns:minmax(0,1fr) auto;padding:16px}.hero-art{display:none}.hero-side .av{display:none}}

/* today board */
.st-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px;margin-bottom:14px}
.st-tile{--c:var(--accent);position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--c) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 28%,transparent);overflow:hidden}
.st-tile b{display:block;font-family:var(--display);font-size:1.6rem;line-height:1;color:var(--c)}
.st-tile span{font-size:.85rem;color:var(--muted)}
.st-ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--surface)}
.st-ic .ic{width:20px;height:20px}
.st-bar{position:absolute;inset:auto 0 0 0;height:3px;background:transparent}.st-bar i{display:block;height:100%;background:var(--c);transition:width .6s}
.st-present{--c:var(--c-present)}.st-late{--c:var(--c-late)}.st-notyet{--c:var(--c-notyet)}.st-absent{--c:var(--c-absent)}.st-leave{--c:var(--c-leave)}
.pgroups{display:grid;gap:12px}
.pgroup h4{margin:0 0 6px;font-size:.85rem;color:var(--muted);font-weight:500;display:flex;gap:6px;align-items:center}
.pgroup h4 span{background:var(--sunken);border-radius:99px;padding:0 8px}
.pchips{display:flex;flex-wrap:wrap;gap:8px}
.pchip{--c:var(--accent);display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border-radius:999px;border:1px solid var(--line);background:var(--surface);text-align:right;transition:transform .15s,border-color .15s}
button.pchip:hover{transform:translateY(-1px);border-color:var(--c)}
.pchip b{display:block;font-size:.88rem;font-weight:600}.pchip small{display:block;font-size:.75rem;color:var(--muted)}
.pchip .av{box-shadow:0 0 0 2px var(--c)}
.pc-present{--c:var(--c-present)}.pc-late{--c:var(--c-late)}.pc-notyet{--c:var(--c-notyet)}.pc-absent{--c:var(--c-absent)}.pc-leave{--c:var(--c-leave)}
.bday-card{display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:12px;border-radius:12px;background:var(--cust-soft);color:var(--cust)}

/* profile */
details.panel>summary{cursor:pointer;font-family:var(--display);font-weight:600;font-size:1.05rem;list-style:none}
details.panel>summary::-webkit-details-marker{display:none}
.prof-top{display:flex;align-items:center;gap:14px}
.av-up{position:relative;cursor:pointer;display:inline-block;color:inherit}
.av-up .av{box-shadow:0 0 0 3px var(--accent-soft)}
.av-cam{position:absolute;bottom:0;left:0;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 0 0 2px var(--surface)}
.av-cam .ic{width:15px;height:15px}
.nid-up{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.nid-up label.btn{cursor:pointer;color:var(--fg)}
.lb{position:fixed;inset:0;z-index:30;background:rgba(8,12,18,.82);display:grid;place-items:center;padding:24px;cursor:zoom-out}
.lb img{max-width:min(100%,900px);max-height:85vh;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lb-x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:14px;color:#fff;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.15)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.confetti i{position:absolute;top:55%;width:9px;height:14px;border-radius:2px;background:var(--accent);animation:pop 1.3s cubic-bezier(.2,.7,.3,1) forwards}

<script>

const DEF_IN=["بيع سيارة","بيع أصول / مقتنيات","تمويل من المالك","تحويل بنكي","عمولة بيع عقار","عمولات أخرى","إيرادات أخرى"];
const DEF_OUT=["بوفيه (مية، شاي، قهوة)","مشتريات مكتب","أثاث وأجهزة","سلف موظفين","إيجار","مرتبات","كهرباء ومياه","إنترنت وتليفون","مواصلات وانتقالات","مصاريف قانونية وحكومية","صيانة","دعاية وتسويق","أخرى"];

const SAL_ADV="سلف موظفين",SAL_PAY="مرتبات";
const ADJ={incentive:{l:"حافز",sign:1},bonus:{l:"مكافأة",sign:1},overtime:{l:"إضافي",sign:1},deduction:{l:"خصم",sign:-1},penalty:{l:"جزاء",sign:-1}};
const app=document.getElementById("app");
const S={db:null,downloads:null,people:[],tx:[],adj:[],att:[],ev:[],profs:[],imgsArr:[],cfg:null,ld:{p:0,t:0,c:0,a:0,at:0,e:0},attDay:today(),empFile:null,me:null,screen:"",view:"summary",
  month:curMonth(),payMonth:curMonth(),kind:"income",editing:null,stmt:null,pendingDel:null,loginPid:null,
  lf:{kind:"",pid:"",cat:"",month:"",q:""}};

/* ---------- helpers ---------- */
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmt(n){return (Math.round((+n||0)*100)/100).toLocaleString("en-US",{maximumFractionDigits:2})}
function money(n,signed){const v=+n||0;const s=signed&&v>0?"+":"";return '<span class="num">'+s+fmt(v)+'</span>'}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function curMonth(){return today().slice(0,7)}
const MF=new Intl.DateTimeFormat("ar-EG-u-nu-latn",{month:"long",year:"numeric"});
function monthLabel(m){if(!m)return "كل الفترات";const [y,mo]=m.split("-");return MF.format(new Date(+y,+mo-1,1))}
function fdate(d){if(!d)return "";const [y,m,dd]=d.split("-");return '<span class="num">'+dd+"/"+m+"/"+y+"</span>"}
function person(id){return S.people.find(p=>p.id===id)}
function pname(id){const p=person(id);return p?p.name:(id?"(محذوف)":"")}
function incCats(){return (S.cfg&&S.cfg.incomeCats)||DEF_IN}
function expCats(){const l=((S.cfg&&S.cfg.expenseCats)||DEF_OUT).slice();[SAL_ADV,SAL_PAY].forEach(c=>{if(!l.includes(c))l.push(c)});return l}
function isSal(c){return c===SAL_ADV||c===SAL_PAY}
function staff(){return S.people.filter(p=>p.active!==false&&can("self_exp",p))}
function salaried(){return S.people.filter(p=>p.active!==false&&(+p.salary>0||p.role==="payroll"))}
function payroll(eid,m){const p=person(eid)||{};const r={salary:+p.salary||0,adv:0,paid:0,advList:[],bon:0,ded:0,adjList:[]};
  S.tx.forEach(t=>{if(t.kind!=="expense"||t.empId!==eid||t.salMonth!==m)return;const a=+t.amount||0;if(t.category===SAL_ADV){r.adv+=a;r.advList.push(t)}else if(t.category===SAL_PAY)r.paid+=a});
  S.adj.forEach(j=>{if(j.empId!==eid||j.month!==m)return;const a=+j.amount||0;if(ADJ[j.type]&&ADJ[j.type].sign>0)r.bon+=a;else r.ded+=a;r.adjList.push(j)});
  r.net=r.salary+r.bon-r.ded;r.rem=r.net-r.adv-r.paid;return r}
function adjList(list,canDel){
  if(!list.length)return "";
  return '<ul class="adjs">'+list.slice().sort((a,b)=>(a.date||"").localeCompare(b.date||"")).map(j=>{const d=ADJ[j.type]||{l:j.type,sign:-1};
    return '<li><span class="pill '+(d.sign>0?"k-income":"k-expense")+'">'+esc(d.l)+'</span> <b class="num '+(d.sign>0?"pos":"neg")+'">'+(d.sign>0?"+":"−")+fmt(j.amount)+"</b> "+(j.date?fdate(j.date)+" · ":"")+'<span>'+esc(j.reason||"")+"</span>"+
    (canDel?' <button class="link'+(S.pendingDel===j.id?" confirm":" danger")+'" data-act="del" data-coll="adj" data-id="'+esc(j.id)+'">'+(S.pendingDel===j.id?"تأكيد الحذف":"حذف")+"</button>":"")+"</li>"}).join("")+"</ul>";
}
const MGR=[["view_all","يشوف الملخص ودفتر الحركات والعهد"],["add_tx","يسجّل وارد ومصروفات ويسلّم عهد"],["edit_tx","يعدّل ويحذف أي حركة"],["payroll","المرتبات والسلف والحوافز والخصومات"],["attendance","يدير الحضور والانصراف"],["employees","ملفات الموظفين والتقييم"],["settings","الإعدادات والأشخاص والصلاحيات"]];

function permsOf(p){if(!p||p.role==="payroll")return [];const all=MGR.map(x=>x[0]);
  if(Array.isArray(p.perms))return p.role==="admin"?[...new Set(p.perms.concat(all))]:p.perms;
  return p.role==="admin"?all:["self_exp","self_att"]}
function can(k,p){return permsOf(p||person(S.me)).includes(k)}
function isMgr(p){return MGR.some(x=>can(x[0],p))}
function hasMine(p){return can("self_exp",p)||can("self_att",p)}
function isAdmin(){return can("settings")}
function fullForm(){return !!document.getElementById("f_person")}
function inMonth(t,m){return !m||(t.date||"").slice(0,7)===m}
function effect(t){const a=+t.amount||0;if(t.kind==="income"||t.kind==="return")return a;if(t.kind==="custody")return -a;if(t.kind==="expense")return t.personId?0:-a;return 0}
function treasury(){return S.tx.reduce((s,t)=>s+effect(t),0)}
function pstats(pid){const r={rec:0,spent:0,ret:0,bal:0};S.tx.forEach(t=>{if(t.personId!==pid)return;const a=+t.amount||0;if(t.kind==="custody")r.rec+=a;else if(t.kind==="expense")r.spent+=a;else if(t.kind==="return")r.ret+=a});r.bal=r.rec-r.spent-r.ret;return r}
function sortTx(list,asc){return list.slice().sort((a,b)=>{const c=(a.date||"").localeCompare(b.date||"")||(a.createdAt||"").localeCompare(b.createdAt||"");return asc?c:-c})}
function months(){const set=new Set([curMonth()]);S.tx.forEach(t=>t.date&&set.add(t.date.slice(0,7)));return [...set].sort().reverse()}

function fillSelect(id,opts){const el=document.getElementById(id);if(!el)return;const v=el.value;const html=opts.map(o=>'<option value="'+esc(o[0])+'">'+esc(o[1])+"</option>").join("");if(el._h!==html){el.innerHTML=html;el._h=html}if(opts.some(o=>o[0]===v))el.value=v}

/* ---------- look & feel: icons, theme, avatars, hero, today board, profiles ---------- */

function ic(n,cls){return '<svg class="ic'+(cls?" "+cls:"")+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(IC[n]||"")+"</svg>"}
const TABIC={summary:"gauge",add:"plus",ledger:"book",custody:"wallet",payroll:"cash",attendance:"clock",employees:"users",settings:"gear",mine:"user"};

/* theme: day/night by the clock, tone by the viewer */
function themePref(){try{return localStorage.getItem("khz_theme")||"auto"}catch(e){return "auto"}}
function isNight(){const h=new Date().getHours();return h<6||h>=18}
function profOf(pid){return (S.profs||[]).find(x=>x.id===pid)||null}
function myProf(){if(!S.me)return null;if(S.staffMode){const pend=[...S.items].reverse().find(i=>i.t==="profile");return Object.assign({},S.V&&S.V.prof||{},pend?pend.data:{})}return profOf(S.me)}
function genderOf(pid){if(S.staffMode&&pid===S.me){const p=myProf();return p&&p.gender||""}const p=profOf(pid);return p&&p.gender||""}
function applyTheme(){const p=themePref();const r=document.documentElement;r.setAttribute("data-theme",p==="auto"?(isNight()?"dark":"light"):p);const g=S.me?genderOf(S.me):"";r.setAttribute("data-tone",g||"n")}
function themeBtn(){const p=themePref();const lbl={auto:"تلقائي حسب الوقت",light:"نهاري",dark:"ليلي"}[p];return '<button class="btn icon-btn" data-act="theme" title="المظهر: '+lbl+'" aria-label="المظهر: '+lbl+'">'+ic(p==="auto"?"auto":p==="dark"?"moon":"sun")+"</button>"}

/* avatars */
function initials(n){const w=String(n||"").replace(/^(أ\.|م\.|د\.)\s*/,"").trim().split(/\s+/)[0]||"";return (w.length>3&&w.startsWith("ال")?w.slice(2):w).charAt(0)}
function avatarSrc(pid){
  if(S.staffMode&&pid===S.me){const pend=[...S.items].reverse().find(i=>i.t==="img"&&i.kind==="avatar");return pend?pend.data:(S.V&&S.V.avatar)||""}
  const im=(S.imgsArr||[]).find(x=>x.id===pid+"_avatar");return im&&im.data||"";
}
function avatar(pid,size,name){const src=avatarSrc(pid);const g=genderOf(pid);const nm=name||pname(pid)||(S.meInfo&&pid===S.me?S.meInfo.name:"");
  return '<span class="av av-'+(g||"n")+'" style="--s:'+(size||32)+'px">'+(src?'<img src="'+src+'" alt="">':esc(initials(nm)))+"</span>"}
function who(pid,sub,size){return '<span class="who-cell">'+avatar(pid,size||30)+'<span><b>'+esc(pname(pid))+"</b>"+(sub?'<span class="sub">'+sub+"</span>":"")+"</span></span>"}

/* greeting hero */

/* today's attendance board */
function todayStatus(pid){
  const w=work(),td=today(),r=attRec(pid,td),now=toMin(nowHM()),s=toMin(w.start),e=toMin(w.end);
  if(r){const st=r.status||"present";if(st==="absent")return {k:"absent"};if(st!=="present")return {k:"leave",l:STAT[st]};const c=dayCalc(r,w);return {k:c.late?"late":"present",in:r.in,out:r.out,late:c.late}}
  if(!isWorkday(td,w))return {k:"off"};
  if(now<s+(+w.grace||0))return {k:"waiting"};
  if(now<e)return {k:"notyet",late:now-s};
  return {k:"absent"};
}
function todayBoard(){
  const emps=salaried().filter(p=>p.active!==false);
  if(!emps.length)return '<div class="empty">حط مرتب لكل موظف من الإعدادات عشان يظهر في الحضور.</div>';
  const G={present:[],late:[],notyet:[],waiting:[],absent:[],leave:[],off:[]};emps.forEach(p=>{const st=todayStatus(p.id);G[st.k].push([p,st])});
  if(G.off.length===emps.length)return '<div class="empty">'+ic("sun")+" النهارده إجازة للكل. يوم سعيد!</div>";
  const tile=(k,label,n,icn,tot)=>'<div class="st-tile st-'+k+'"><span class="st-ic">'+ic(icn)+'</span><div><b class="num">'+n+'</b><span>'+label+"</span></div>"+(tot?'<i class="st-bar"><i style="width:'+Math.round(n/tot*100)+'%"></i></i>':"")+"</div>";
  const tot=emps.length-G.off.length;const pres=G.present.length+G.late.length;
  const clickable=can("employees");

async function shrink(file,kind){
  const img=await loadImg(file);const sq=kind==="avatar",lim=sq?40000:140000;let max=sq?320:1400,q=0.85,out="";
  for(let i=0;i<10;i++){
    const c=document.createElement("canvas");let sw=img.naturalWidth,sh=img.naturalHeight,sx=0,sy=0;
    if(sq){const m=Math.min(sw,sh);sx=(sw-m)/2;sy=(sh-m)/2;sw=sh=m;c.width=c.height=Math.min(max,m)}else{const r=Math.min(1,max/Math.max(sw,sh));c.width=Math.round(sw*r);c.height=Math.round(sh*r)}
    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);
    out=c.toDataURL("image/jpeg",q);if(out.length<=lim)return out;q-=0.12;if(q<0.5){q=0.75;max=Math.round(max*0.8)}
  }
  return out.length<=lim?out:null;
}

/* ---------- hosted mode: own server (api.php) instead of claude.ai storage ---------- */
const HOSTED=!!window.SAWA_API;
function RemoteDB(api){
  const mirror=new Map(),subs=new Set();let rev=0,token=null,timer=null,busy=false,synced1=false,waiters=[];
  async function call(body){
    let r;try{r=await fetch(api,{method:"POST",headers:Object.assign({"Content-Type":"application/json"},token?{"X-Session":token}:{}),body:JSON.stringify(body),cache:"no-store",credentials:"same-origin"})}
    catch(e){const er=new Error("مفيش اتصال بالسيرفر. اتأكد من النت وجرّب تاني.");er.code="network";throw er}
    let j;try{j=await r.json()}catch(e){j={ok:false,error:"bad_response",msg:"السيرفر رجّع رد مش مفهوم (كود "+r.status+"). اتأكد إن api.php وconfig.php مرفوعين صح."}}
    if(!j.ok){const er=new Error(j.msg||j.error||"خطأ");er.code=j.error;if(j.error==="auth"&&token){token=null;stop();setTimeout(()=>lock("الجلسة انتهت، ادخل تاني."))}throw er}
    return j;
  }
  function notify(){subs.forEach(f=>{try{f()}catch(e){console.warn(e)}})}
  async function poll(){
    if(busy||!token)return;busy=true;let changed=false;
    try{let more=true;while(more&&token){const j=await call({a:"changes",since:rev});j.docs.forEach(d=>{if(d.del)mirror.delete(d.path);else mirror.set(d.path,d.data)});if(j.docs.length)changed=true;rev=j.rev;more=j.more}
      if(!synced1){synced1=true;changed=true;waiters.splice(0).forEach(f=>f())}}catch(e){}
    busy=false;if(changed)notify();
  }
  function schedule(){clearTimeout(timer);if(!token)return;timer=setTimeout(async()=>{await poll();schedule()},document.hidden?15000:4000)}
  function stop(){clearTimeout(timer);timer=null}
  function synced(){return synced1?Promise.resolve():new Promise(r=>waiters.push(r))}
  function snap(path,v){return {id:path.slice(path.lastIndexOf("/")+1),exists:v!==undefined,data:()=>v===undefined?undefined:JSON.parse(JSON.stringify(v))}}
  function docsOf(c){const out=[],pre=c+"/";for(const [k,v] of mirror)if(k.startsWith(pre)&&k.indexOf("/",pre.length)<0)out.push(snap(k,v));return out.sort((a,b)=>a.id<b.id?-1:a.id>b.id?1:0)}
  async function write(op,path,data){
    await call({a:"write",op,path,data});
    if(op==="delete")mirror.delete(path);else if(op==="update")mirror.set(path,Object.assign({},mirror.get(path)||{},data));else mirror.set(path,data);
    notify();setTimeout(poll,60);
  }
  function docRef(path){return {id:path.slice(path.lastIndexOf("/")+1),path,
    get:async()=>{await synced();return snap(path,mirror.get(path))},
    set:d=>write("set",path,JSON.parse(JSON.stringify(d))),
    update:d=>write("update",path,JSON.parse(JSON.stringify(d))),
    delete:()=>write("delete",path),
    onSnapshot(fn){let last="\u0000";const f=()=>{if(!synced1)return;const v=mirror.get(path);const j=v===undefined?"\u0001":JSON.stringify(v);if(j===last)return;last=j;fn(snap(path,v))};subs.add(f);setTimeout(f,0);return ()=>subs.delete(f)}}}
  function coll(c){return {path:c,doc:id=>docRef(c+"/"+(id||rid("d_"))),
    add:async d=>{const r=docRef(c+"/"+rid("d_"));await r.set(d);return r},
    get:async()=>{await synced();const docs=docsOf(c);return {docs,size:docs.length,empty:!docs.length}},
    onSnapshot(fn){let last=null;const f=()=>{if(!synced1)return;const docs=docsOf(c);const j=JSON.stringify(docs.map(d=>[d.id,mirror.get(c+"/"+d.id)]));if(j===last)return;last=j;fn({docs,size:docs.length,empty:!docs.length})};subs.add(f);setTimeout(f,0);return ()=>subs.delete(f)}}}
  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&token){poll();schedule()}});
  return {collection:coll,doc:docRef,call,poll,
    async start(tok){token=tok;rev=0;mirror.clear();synced1=false;await poll();schedule()},
    async end(){const t=token;token=null;stop();mirror.clear();rev=0;synced1=false;
      if(t){try{await fetch(api,{method:"POST",headers:{"Content-Type":"application/json","X-Session":t},body:'{"a":"logout"}'})}catch(e){}}},
    peekColl:c=>docsOf(c).map(d=>Object.assign({id:d.id},d.data())),
    bulk:docs=>call({a:"bulk",docs})};
}
async function authKey(u,pw){
  const base=await crypto.subtle.importKey("raw",TE.encode(pw),"PBKDF2",false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:TE.encode("sawa-auth:"+u),iterations:150000,hash:"SHA-256"},base,256);
  return [...new Uint8Array(bits)].map(x=>x.toString(16).padStart(2,"0")).join("");
}

/* ---------- security: encryption, keys, sessions ---------- */
const TE=new TextEncoder(),TD=new TextDecoder();
const COLLS=["tx","adj","att","eval","prof","img"],CST={tx:["tx","t"],adj:["adj","a"],att:["att","at"],eval:["ev","e"],prof:["profs","pr"],img:["imgsArr","im"]};
const LOCK_MIN=20,PW_MGR=8,PW_STAFF=6;
function b64(u){let s="";for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)}
function ub64(s){const b=atob(s);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function rnd(n){return crypto.getRandomValues(new Uint8Array(n))}
function rid(p){return (p||"d_")+Date.now().toString(36)+[...rnd(5)].map(x=>(x%36).toString(36)).join("")}
async function pwKey(pw,salt,it){const base=await crypto.subtle.importKey("raw",TE.encode(pw),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt:ub64(salt),iterations:it||250000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function aesEnc(key,u8,aad){const iv=rnd(12);const p={name:"AES-GCM",iv};if(aad)p.additionalData=TE.encode(aad);const c=new Uint8Array(await crypto.subtle.encrypt(p,key,u8));const o=new Uint8Array(12+c.length);o.set(iv);o.set(c,12);return b64(o)}
async function aesDec(key,s,aad){const u=ub64(s);const p={name:"AES-GCM",iv:u.subarray(0,12)};if(aad)p.additionalData=TE.encode(aad);return new Uint8Array(await crypto.subtle.decrypt(p,key,u.subarray(12)))}
async function encJ(key,o,aad){return aesEnc(key,TE.encode(JSON.stringify(o)),aad)}
async function decJ(key,s,aad){if(typeof s!=="string")throw new Error("plain");return JSON.parse(TD.decode(await aesDec(key,s,aad)))}
function genKeyB64(){return b64(rnd(32))}
function impKey(b){return crypto.subtle.importKey("raw",ub64(b),"AES-GCM",false,["encrypt","decrypt"])}
async function wrapKey(kb64,pw){const s=b64(rnd(16));const k=await pwKey(pw,s);return {s,it:250000,d:await aesEnc(k,TE.encode(kb64),"wrap")}}
async function unwrapKey(w,pw){const k=await pwKey(pw,w.s,w.it);return TD.decode(await aesDec(k,w.d,"wrap"))}

async function decPeople(){
  const out=[],bad=[];
  for(const r of S.rawPeople){
    if(!r.sec){bad.push(r.id);continue}
    try{const sec=await decJ(S.K,r.sec,"people/"+r.id);
      if(sec.ks&&S.ksB64[r.id]!==sec.ks){S.ksB64[r.id]=sec.ks;S.ks[r.id]=await impKey(sec.ks)}
      out.push(Object.assign({id:r.id,name:r.name,title:r.title,order:r.order,user:r.user||"",hasK:!!r.wK,hasS:!!r.wS},sec));
    }catch(e){bad.push(r.id)}
  }
  S.people=out.sort((a,b)=>(a.order??99)-(b.order??99));S.bad.people=bad;
}
async function decColl(c,docs){
  const out=[],bad=[],ids=new Set(),cache={},raw={};
  for(const d of docs){ids.add(d.id);const r=d.data();raw[d.id]=r;
    try{const o=await decJ(S.K,r&&r.e,c+"/"+d.id);cache[d.id]=o;if(!o._del)out.push(Object.assign({},o,{id:d.id}))}catch(e){bad.push(d.id)}}
  return {out,bad,ids,cache,raw};
}

/* ---------- tamper check (seal) ---------- */
function sealCols(){return ["people"].concat(COLLS)}
function validIds(c){return c==="people"?S.people.map(p=>p.id):Object.keys(S.cache[c]||{})}
function sealCheck(){
  if(!S.ld.s||S.sealGone||S.sealBad)return;
  const seal=S.seal||{ids:{},missing:{}};const ids={},missing={};let changed=!S.seal;
  sealCols().forEach(c=>{
    const prev=(seal.ids||{})[c]||[],present=S.rawIds[c]||new Set();
    const miss=new Set(((seal.missing||{})[c]||[]).filter(id=>!present.has(id)));
    prev.forEach(id=>{if(!present.has(id))miss.add(id)});
    ids[c]=[...new Set(prev.concat(validIds(c)))].sort();missing[c]=[...miss].sort();
    if(ids[c].join()!==prev.slice().sort().join()||missing[c].join()!==(((seal.missing||{})[c])||[]).slice().sort().join())changed=true;
  });
  S.missing=missing;
  if(changed&&!S.sealBad)writeSeal({ids,missing});
}
function writeSeal(obj){clearTimeout(S._sealT);S._sealT=setTimeout(async()=>{if(!S.K)return;S.sealWriting=true;
  try{await S.db.doc("meta/seal").set({e:await encJ(S.K,Object.assign({at:new Date().toISOString()},obj),"meta/seal")})}catch(e){}S.sealWriting=false},1500)}
function issues(){
  const miss=Object.values(S.missing||{}).reduce((s,a)=>s+a.length,0);
  const bad=Object.entries(S.bad||{}).reduce((s,[c,a])=>s+(c.startsWith("bx_")?0:a.length),0);
  return {miss,bad,sealBad:S.sealBad,sealGone:S.sealGone,any:miss||bad||S.sealBad||S.sealGone};
}

function staffBoxes(){return S.people.filter(p=>p.active!==false&&p.hasS&&S.ks[p.id]&&!p.hasK)}
function syncBoxSubs(){
  const want=new Set(staffBoxes().map(p=>p.id));
  Object.keys(S.boxSubs).forEach(pid=>{if(!want.has(pid)){S.boxSubs[pid]();delete S.boxSubs[pid];delete S.box[pid]}});
  want.forEach(pid=>{if(S.boxSubs[pid])return;const c="bx_"+pid;
    S.boxSubs[pid]=S.db.collection(c).onSnapshot(async s=>{const key=S.ks[pid];if(!key)return;const seq=S.seq[c]=(S.seq[c]||0)+1;
      const b={view:null,items:[],bad:[]};
      for(const d of s.docs){const r=d.data();try{const o=await decJ(key,r&&r.e,c+"/"+d.id);if(d.id==="view")b.view=o;else b.items.push(Object.assign({},o,{id:d.id}))}catch(e){b.bad.push(d.id)}}
      if(seq!==S.seq[c])return;S.box[pid]=b;scheduleSync();
    },()=>{})});
}
function scheduleSync(){clearTimeout(S._syncT);S._syncT=setTimeout(runSync,1200)}
async function runSync(){
  if(!S.K||S.staffMode)return;if(S.syncing){S.syncAgain=true;return}S.syncing=true;
  try{
    syncBoxSubs();
    for(const pid of Object.keys(S.box)){
      const b=S.box[pid],c="bx_"+pid;
      for(const id of b.bad)await S.db.collection(c).doc(id).delete();
      b.bad=[];
      for(const it of b.items.slice()){
        const amt=Math.round((+it.amount||0)*100)/100;
        if(it.t==="expense"&&amt>0&&/^\d{4}-\d\d-\d\d$/.test(it.date||"")){
          if(!(S.cache.tx||{})["s_"+it.id])await E.collection("tx").doc("s_"+it.id).set({kind:"expense",date:it.date,amount:amt,category:String(it.category||"أخرى").slice(0,80),note:String(it.note||"").slice(0,300),source:"",personId:pid,empId:it.empId||"",salMonth:it.salMonth||"",createdBy:pid,createdAt:it.at||new Date().toISOString(),via:"staff"});

          if(it.t==="out"&&!r)await E.collection("att").doc(aid).set({empId:pid,date:it.date,status:"present",in:"",out:it.time,by:pid,outAt:it.at||""});

          const d=it.data,cl=(x,n)=>String(x||"").slice(0,n||120),dt=x=>/^\d{4}-\d\d-\d\d$/.test(x||"")?x:"";

  }catch(e){console.warn("sync",e)}

async function doRestore(file){
  let j;try{j=JSON.parse(await file.text())}catch(e){return toast("الملف ده مش نسخة احتياطية صحيحة")}
  if(!j||j.app!=="khazna"||!j.docs)return toast("الملف ده مش نسخة احتياطية من الدفتر");
  let n=0;
  try{
    for(const [c,map] of Object.entries(j.docs)){if(!["people","config"].concat(COLLS).includes(c))continue;
      const present=c==="config"?new Set(Object.keys(S.rawDocs.config||{})):S.rawIds[c]||new Set();const bad=new Set(S.bad[c]||[]);
      for(const [id,raw] of Object.entries(map)){if(present.has(id)&&!bad.has(id))continue;
        if(c==="people"){if(!raw.sec)continue;try{await decJ(S.K,raw.sec,"people/"+id)}catch(e){continue}}
        else{try{await decJ(S.K,raw.e,c+"/"+id)}catch(e){continue}}
        await S.db.collection(c).doc(id).set(raw);n++}}
    toast(n?"اترجع "+n+" سجل":"مفيش حاجة ناقصة تترجع من النسخة دي");
  }catch(e){dbErr(e)}
}

function txRow(t,opts){

function salSub(t){return t.empId?'<span class="sub">لـ '+esc(pname(t.empId))+" · مرتب "+esc(monthLabel(t.salMonth))+"</span>":""}
function actions(t){
  const admin=can("edit_tx");const own=t.createdBy===S.me&&t.kind==="expense";

  return '<table><thead><tr><th>التاريخ</th><th>النوع</th><th>البند / البيان</th><th>الشخص</th><th>المبلغ</th><th>أثر على الخزنة</th>'+(actionsCol?"<th></th>":"")+"</tr></thead><tbody>"+list.map(t=>txRow(t,{actions:actionsCol})).join("")+"</tbody></table>";

function statementHTML(pid,withActions){
  const rows=sortTx(S.tx.filter(t=>t.personId===pid&&["custody","expense","return"].includes(t.kind)),true);
  if(!rows.length)return '<div class="empty">مفيش حركات على الحساب ده لسه.</div>';
  let bal=0;const out=rows.map(t=>{const a=+t.amount||0;const inn=t.kind==="custody"?a:0;const o=inn?0:a;bal+=inn-o;
    const desc=(t.kind==="expense"?esc(t.category||"مصروف")+salSub(t):'<span class="pill k-'+t.kind+'">'+KIND[t.kind]+"</span>")+(t.note?'<span class="sub">'+esc(t.note)+"</span>":"")+(t.createdBy&&t.createdBy!==pid&&t.kind==="expense"?'<span class="sub">سجّلها: '+esc(pname(t.createdBy))+"</span>":"");
    return "<tr><td>"+fdate(t.date)+"</td><td>"+desc+'</td><td class="n pos">'+(inn?money(inn):"")+'</td><td class="n neg">'+(o?money(o):"")+'</td><td class="n"><b class="'+(bal<0?"neg":"")+'">'+money(bal)+"</b></td>"+(withActions?"<td>"+actions(t)+"</td>":"")+"</tr>"}).reverse();

const CRIT=[["punctual","الالتزام بالمواعيد"],["quality","جودة الشغل"],["output","الإنجاز والإنتاجية"],["team","التعاون مع الفريق"],["conduct","السلوك والانضباط"]];
const STAT={present:"حضور",absent:"غياب",leave:"إجازة",mission:"مأمورية"};
const SCORE=["","ضعيف","مقبول","جيد","جيد جدًا","ممتاز"];
function work(){const w=Object.assign({},DEF_WORK,(S.cfg&&S.cfg.work)||{});w.offDays=(w.offDays||[]).map(Number);w.holidays=w.holidays||[];return w}
function r2(n){return Math.round((+n||0)*100)/100}
function toMin(t){if(!t)return null;const p=String(t).split(":").map(Number);return p[0]*60+(p[1]||0)}
function nowHM(){const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function dow(iso){const p=iso.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]).getDay()}
function attId(eid,date){return eid+"_"+date}
function attRec(eid,date){return S.att.find(a=>a.empId===eid&&a.date===date)}
function isWorkday(iso,w){return !w.offDays.includes(dow(iso))&&!w.holidays.includes(iso)}
function dur(m){m=Math.round(m||0);if(!m)return "—";const h=Math.floor(m/60),mm=m%60;return '<span class="num">'+(h?h+"س":"")+(h&&mm?" ":"")+(mm?mm+"د":"")+"</span>"}
function durTxt(m){m=Math.round(m||0);const h=Math.floor(m/60),mm=m%60;return (h?h+" ساعة":"")+(h&&mm?" و":"")+(mm?mm+" دقيقة":"")||"0"}
function dayCalc(r,w){
  const o={late:0,early:0,ot:0};if(!r||(r.status||"present")!=="present")return o;
  const s=toMin(w.start),e=toMin(w.end),i=toMin(r.in),u=toMin(r.out);
  if(!isWorkday(r.date,w)){if(i!=null&&u!=null&&u>i)o.ot=u-i;return o}
  if(i!=null&&i-s>(+w.grace||0))o.late=i-s;
  if(u!=null&&e-u>0)o.early=e-u;
  if(u!=null&&u-e>=(+w.otMin||0))o.ot=u-e;
  return o;
}
function attSum(eid,m){
  const w=work();const r={work:0,present:0,absent:0,leave:0,late:0,early:0,ot:0,lateDays:0,days:[]};
  const first=S.att.filter(a=>a.empId===eid).map(a=>a.date).sort()[0];
  const p=m.split("-").map(Number);const n=new Date(p[0],p[1],0).getDate();const td=today();
  for(let d=1;d<=n;d++){
    const iso=m+"-"+String(d).padStart(2,"0");if(iso>td)break;
    const rec=attRec(eid,iso);const wd=isWorkday(iso,w);let kind;
    if(rec)kind=rec.status||"present";else if(wd&&first&&iso>=first&&iso<td)kind="absent";else kind=wd?"none":"off";
    const c=dayCalc(rec,w);
    if(wd&&kind!=="none")r.work++;
    if(kind==="present"){r.present++;r.late+=c.late;r.early+=c.early;r.ot+=c.ot;if(c.late)r.lateDays++}
    else if(kind==="absent")r.absent++;else if(kind==="leave"||kind==="mission")r.leave++;
    r.days.push({iso,rec,kind,wd,c});
  }
  const sal=+((person(eid)||{}).salary)||0;const wm=Math.max(1,toMin(w.end)-toMin(w.start));
  const dayRate=sal/(+w.divisor||30),minRate=dayRate/wm;
  r.dayRate=r2(dayRate);r.absAmt=r2(r.absent*dayRate*(+w.absMult||1));r.lateAmt=r2((r.late+r.early)*minRate);r.otAmt=r2(r.ot*minRate*(+w.otRate||1));
  r.approved=S.adj.filter(j=>j.empId===eid&&j.month===m&&j.src==="att");
  const sugg=r.otAmt-r.absAmt-r.lateAmt;const appr=r.approved.reduce((s,j)=>s+((ADJ[j.type]||{}).sign>0?1:-1)*(+j.amount||0),0);
  r.state=!r.approved.length?(r.absAmt||r.lateAmt||r.otAmt?"pending":"none"):Math.abs(sugg-appr)<0.01?"ok":"changed";
  return r;
}
function evalOf(eid,m){return S.ev.find(x=>x.id===attId(eid,m))}
function evalAvg(ev){if(!ev||!ev.scores)return null;const v=CRIT.map(c=>+ev.scores[c[0]]||0).filter(Boolean);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null}
function suggestPunct(a){return Math.max(1,Math.min(5,5-a.absent-Math.floor((a.late+a.early)/60)))}
function stars(avg){if(avg==null)return '<span class="muted">لسه</span>';const pct=avg/5*100;const cls=avg>=4?"pos":avg>=3?"":"neg";
  return '<span class="score"><span class="meter"><i style="width:'+pct+'%"></i></span><b class="num '+cls+'">'+avg.toFixed(1)+'</b><span class="muted small">/5</span></span>'}
function setKeep(id,html){const el=document.getElementById(id);if(!el)return;if(el.contains(document.activeElement)&&el._h!=null)return;if(el._h!==html){el.innerHTML=html;el._h=html}}
function monthsFor(eid){const s=new Set([curMonth(),S.payMonth]);S.adj.forEach(j=>j.empId===eid&&j.month&&s.add(j.month));S.tx.forEach(t=>t.empId===eid&&t.salMonth&&s.add(t.salMonth));S.att.forEach(a=>a.empId===eid&&s.add(a.date.slice(0,7)));S.ev.forEach(e=>e.empId===eid&&s.add(e.month));return [...s].sort().reverse()}

      '<div class="row"><label>أيام الشهر في الحسبة<input type="number" min="1" id="w_divisor" value="'+w.divisor+'"></label><label>ساعة الإضافي = ساعة عادية ×<input type="number" min="0" step="0.25" id="w_otRate" value="'+w.otRate+'"></label><label>يوم الغياب = يوم مرتب ×<input type="number" min="0" step="0.25" id="w_absMult" value="'+w.absMult+'"></label></div>'+
      '<div><span class="muted small" style="font-weight:500">الإجازة الأسبوعية</span><div class="chips" style="margin-top:6px">'+DAYN.map((d,i)=>'<label class="chip" style="padding:4px 10px;display:inline-flex;gap:6px;color:var(--fg)"><input type="checkbox" id="w_off_'+i+'" style="width:auto"'+(w.offDays.includes(i)?" checked":"")+">"+d+"</label>").join("")+"</div></div>"+
      '<div><span class="muted small" style="font-weight:500">إجازات رسمية</span><div class="chips" style="margin-top:6px">'+(w.holidays.length?w.holidays.slice().sort().map(h=>'<span class="chip">'+fdate(h)+'<button type="button" data-act="holRm" data-d="'+esc(h)+'" aria-label="حذف">×</button></span>').join(""):'<span class="muted small">مفيش</span>')+'</div><div class="inline" style="max-width:360px"><input type="date" id="w_hol"><button class="btn" type="button" data-act="holAdd">إضافة إجازة</button></div></div>'+
      '<p class="hint">مثال: مرتب 6000 ÷ 30 يوم = 200 ج.م لليوم. الشغل 8 ساعات يعني الدقيقة بـ 0.42 ج.م تقريبًا. التأخير بيتحسب من أول دقيقة لو عدّى وقت السماح.</p><div class="actions"><button class="primary" type="button" data-act="workSave">حفظ المواعيد</button></div></div>');
  }
}

function staffHR(){
  const me=S.me,td=today(),r=attRec(me,td),w=work();const a=attSum(me,curMonth());const c=dayCalc(r,w);
  let btn;
  if(!r)btn='<button class="primary" data-act="checkIn">تسجيل حضور الآن</button>';
  else if((r.status||"present")!=="present")btn='<span class="pill k-custody">'+(STAT[r.status]||"")+"</span>";
  else if(!r.out)btn='<button class="primary" data-act="checkOut">تسجيل انصراف الآن</button>';
  else btn='<span class="pill k-income">اليوم خلص</span>';
  setHTML("myAtt",'<div class="panel-h"><h2>الحضور</h2><span class="muted small">'+DAYN[dow(td)]+" "+fdate(td)+" · المواعيد "+esc(w.start)+" – "+esc(w.end)+'</span></div><div class="actions">'+btn+
    (r&&r.in?'<span>حضور <b class="num">'+esc(r.in)+"</b></span>":"")+(r&&r.out?'<span>انصراف <b class="num">'+esc(r.out)+"</b></span>":"")+(c.late?'<span class="neg">تأخير '+dur(c.late)+"</span>":"")+(c.ot?'<span class="pos">إضافي '+dur(c.ot)+"</span>":"")+
    '</div><p class="muted small" style="margin-bottom:0">'+esc(monthLabel(curMonth()))+": حضور "+a.present+" يوم · غياب "+a.absent+" · تأخير "+durTxt(a.late+a.early)+" · إضافي "+durTxt(a.ot)+"</p>");
}

function hrClick(a,id,b){
  const el=x=>document.getElementById(x);
  if(a==="attSave"){
    const st=el("ad_st_"+id).value,tin=el("ad_in_"+id).value,tout=el("ad_out_"+id).value;
    if(!st&&!tin)return toast("اختار الحالة أو اكتب وقت الحضور"),true;
    const status=st||"present";if(status==="present"&&!tin){toast("اكتب وقت الحضور");return true}
    const prev=attRec(id,S.attDay)||{};
    E.collection("att").doc(attId(id,S.attDay)).set({empId:id,date:S.attDay,status,in:status==="present"?tin:"",out:status==="present"?tout:"",note:prev.note||"",by:prev.by||S.me,editedBy:S.me,editedAt:new Date().toISOString()}).then(()=>{el("ad_st_"+id)&&el("ad_st_"+id).blur();toast("اتحفظ حضور "+pname(id));refresh()}).catch(dbErr);
    return true;
  }
  if(a==="attClear"){E.collection("att").doc(attId(id,S.attDay)).delete().then(()=>toast("اتمسح")).catch(dbErr);return true}
  if(a==="attApprove"){attApprove(id,S.payMonth);return true}
  if(a==="file"){S.empFile=id;if(S.view!=="employees"){S.view="employees";go()}else refresh();const fp=el("filePanel");fp&&fp.scrollIntoView({behavior:"smooth",block:"start"});return true}
  if(a==="fileMonth"){S.payMonth=b.dataset.m;refresh();return true}
  if(a==="adjGo"){S.view="payroll";go();setTimeout(()=>{const s=el("j_emp");if(s)s.value=S.empFile;const p=el("adjPanel");p&&p.scrollIntoView({block:"start"})},0);return true}
  if((a==="checkIn"||a==="checkOut")&&S.staffMode){const t=nowHM();putItem({t:a==="checkIn"?"in":"out",date:today(),time:t}).then(()=>toast((a==="checkIn"?"اتسجل حضورك ":"اتسجل انصرافك ")+t)).catch(dbErr);return true}
  if(a==="checkIn"){const t=nowHM(),d=today();E.collection("att").doc(attId(S.me,d)).set({empId:S.me,date:d,status:"present",in:t,out:"",by:S.me,inAt:new Date().toISOString()}).then(()=>toast("اتسجل حضورك "+t)).catch(dbErr);return true}
  if(a==="checkOut"){const t=nowHM(),d=today();E.collection("att").doc(attId(S.me,d)).update({out:t,outAt:new Date().toISOString()}).then(()=>toast("اتسجل انصرافك "+t)).catch(dbErr);return true}
  if(a==="workSave"){
    const n=(x,d)=>{const v=parseFloat(el(x).value);return isNaN(v)?d:v};
    const off=DAYN.map((_,i)=>el("w_off_"+i).checked?i:-1).filter(i=>i>=0);
    const nw=Object.assign(work(),{start:el("w_start").value||"09:00",end:el("w_end").value||"17:00",grace:n("w_grace",15),otMin:n("w_otMin",30),divisor:n("w_divisor",30)||30,otRate:n("w_otRate",1.5),absMult:n("w_absMult",1),offDays:off});
    if(toMin(nw.end)<=toMin(nw.start)){toast("نهاية الشغل لازم تكون بعد البداية");return true}
    document.activeElement&&document.activeElement.blur();saveCfg({work:nw}).then(ok=>ok&&toast("المواعيد اتحفظت"));return true;
  }
  if(a==="holAdd"){const d=el("w_hol").value;if(!d){toast("اختار التاريخ");return true}const w=work();if(!w.holidays.includes(d))w.holidays.push(d);document.activeElement&&document.activeElement.blur();saveCfg({work:w});return true}
  if(a==="holRm"){const w=work();w.holidays=w.holidays.filter(h=>h!==b.dataset.d);saveCfg({work:w});return true}
  return false;
}
async function attApprove(eid,m){
  const r=attSum(eid,m);
  try{
    for(const j of r.approved)await E.collection("adj").doc(j.id).delete();
    const base={empId:eid,month:m,date:today(),src:"att",createdBy:S.me,createdAt:new Date().toISOString()};const items=[];
    if(r.absAmt>0)items.push({type:"penalty",amount:r.absAmt,reason:"غياب "+r.absent+" يوم — "+monthLabel(m)});
    if(r.lateAmt>0)items.push({type:"deduction",amount:r.lateAmt,reason:"تأخير وانصراف مبكر "+durTxt(r.late+r.early)+" — "+monthLabel(m)});
    if(r.otAmt>0)items.push({type:"overtime",amount:r.otAmt,reason:"ساعات إضافي "+durTxt(r.ot)+" — "+monthLabel(m)});
    for(const it of items)await E.collection("adj").add(Object.assign({},base,it));
    toast(items.length?"اتعتمد على مرتب "+pname(eid):"مفيش خصم أو إضافي");
  }catch(err){dbErr(err)}
}
async function saveEval(f){
  const eid=f.dataset.emp,m=f.dataset.month;const scores={};CRIT.forEach(c=>{const v=document.getElementById("ev_"+c[0]).value;if(v)scores[c[0]]=+v});
  if(!Object.keys(scores).length)return toast("اختار درجة واحدة على الأقل");
  try{await E.collection("eval").doc(attId(eid,m)).set({empId:eid,month:m,scores,notes:document.getElementById("ev_notes").value.trim(),by:S.me,at:new Date().toISOString()});document.activeElement&&document.activeElement.blur();toast("التقييم اتحفظ");refresh()}catch(err){dbErr(err)}
}

/* ---------- events ---------- */
app.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  if(a!=="del"&&S.pendingDel){S.pendingDel=null;setTimeout(refresh)}
  if(secClick(a,id,b)){}
  else if(a==="view"){S.view=b.dataset.v;S.editing=null;go();window.scrollTo(0,0);if(S.view==="settings")loadSrvUsers()}
  else if(a==="kind"){S.kind=b.dataset.k;applyKind()}
  else if(a==="quick"){S.kind=b.dataset.k;S.view="add";S.editing=null;go();if(b.dataset.k!=="income"&&S.stmt){const p=document.getElementById("f_person");if(p)p.value=S.stmt}}
  else if(hrClick(a,id,b)){}
  else if(a==="adjFor"){const s=document.getElementById("j_emp");if(s)s.value=id;const p=document.getElementById("adjPanel");if(p)p.scrollIntoView({behavior:"smooth",block:"start"});setTimeout(()=>{const x=document.getElementById("j_amount");x&&x.focus({preventScroll:true})},300)}
  else if(a==="salAdv"||a==="salPay"){
    if(!can("add_tx"))return toast("محتاج صلاحية تسجيل الحركات");
    S.kind="expense";S.view="add";S.editing=null;go();window.scrollTo(0,0);
    const el=x=>document.getElementById(x);
    el("f_cat").value=a==="salAdv"?SAL_ADV:SAL_PAY;el("f_month").value=S.payMonth;salUpdate();el("f_emp").value=id;
    if(a==="salPay"){el("f_amount").value=b.dataset.amt;el("f_note").value="باقي مرتب "+monthLabel(S.payMonth)}
    salUpdate();el("f_amount").focus();
  }
  else if(a==="stmt"){S.stmt=id;if(S.view!=="custody"){S.view="custody";go()}else refresh()}
  else if(a==="edit"){const t=S.tx.find(x=>x.id===id);if(!t)return;S.editing=id;S.kind=t.kind;S.view="add";go();window.scrollTo(0,0)}
  else if(a==="cancelEdit"){S.editing=null;S.screen="";onData()}
  else if(a==="del"){
    if(S.pendingDel!==id){S.pendingDel=id;refresh();clearTimeout(S._dt);S._dt=setTimeout(()=>{S.pendingDel=null;refresh()},4000);return}
    S.pendingDel=null;const coll=b.dataset.coll||"tx";try{await E.collection(coll).doc(id).delete();toast(coll==="adj"?"اتحذف":"اتحذفت الحركة")}catch(err){dbErr(err)}
  }
  else if(a==="csv")exportCSV();
  else if(a==="rmCat"){const key=b.dataset.key;const list=(key==="incomeCats"?incCats():expCats()).slice();list.splice(+b.dataset.i,1);await saveCats(key,list)}
});
app.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="period"){S.month=t.value;refresh()}
  if(t.id&&t.id.startsWith("lf_")&&t.id!=="lf_q"){S.lf[t.id.slice(3)]=t.value;refresh()}
  if(t.id==="f_cat"||t.id==="f_emp"||t.id==="f_month")salUpdate();
  if((t.id==="payMonth"||t.id==="attMonth"||t.id==="empMonth")&&t.value){S.payMonth=t.value;refresh()}
  if(t.dataset&&t.dataset.pf==="role"){const id=t.dataset.id;app.querySelectorAll('[data-perm][data-id="'+id+'"]').forEach(x=>{const mg=MGR.some(m=>m[0]===x.dataset.perm);
    if(t.value==="payroll"){x.disabled=true;x.checked=false}else if(t.value==="admin"&&mg){x.disabled=true;x.checked=true}else x.disabled=false})}
  if((t.id==="pf_avatar"||t.id==="pf_nidimg")&&t.files&&t.files[0]){const pf=t.closest("form");uploadImg(t.files[0],t.id==="pf_avatar"?"avatar":"nid",pf?pf.dataset.pid:S.me);t.value=""}
  if(t.id==="restoreFile"&&t.files&&t.files[0]){doRestore(t.files[0]);t.value=""}
  if(t.id==="attDay"&&t.value){S.attDay=t.value;refresh()}
  if(t.id&&t.id.startsWith("ad_st_")){const eid=t.id.slice(6);const i=document.getElementById("ad_in_"+eid);if(t.value==="present"&&i&&!i.value)i.value=work().start}
});
app.addEventListener("input",e=>{if(e.target.id==="lf_q"){S.lf.q=e.target.value;refresh()}
  if(e.target.id==="pf_nid"){const n=nidInfo(e.target.value.trim());if(n){const b=document.getElementById("pf_birth"),g=document.getElementById("pf_gender");if(b&&!b.value)b.value=n.birth;if(g&&!g.value)g.value=n.gender}}});
app.addEventListener("submit",async e=>{
  e.preventDefault();const f=e.target;
  if(secSubmit(f))return;
  if(f.id==="txForm")saveTx(f);
  else if(f.id==="evalForm")saveEval(f);
  else if(f.id==="adjForm"){
    const g=x=>document.getElementById(x).value.trim();const amount=parseFloat(g("j_amount"));
    if(!g("j_emp"))return toast("اختار الموظف");if(!(amount>0))return toast("اكتب مبلغ صحيح");if(!g("j_reason"))return toast("اكتب السبب");
    const type=g("j_type");
    try{await E.collection("adj").add({empId:g("j_emp"),type,amount:Math.round(amount*100)/100,reason:g("j_reason"),date:g("j_date")||today(),month:S.payMonth,createdBy:S.me,createdAt:new Date().toISOString()});
      document.getElementById("j_amount").value="";document.getElementById("j_reason").value="";toast(ADJ[type].l+" اتسجل على "+pname(g("j_emp")))}catch(err){dbErr(err)}
  }
  else if(f.dataset.catform){const key=f.dataset.catform;const inp=f.querySelector("input");const v=inp.value.trim();if(!v)return;const list=(key==="incomeCats"?incCats():expCats()).slice();if(!list.includes(v))list.push(v);inp.value="";await saveCats(key,list)}
});
async function saveCats(key,list){const p={};p[key]=list;await saveCfg(p)}
async function saveCfg(patch){const data={incomeCats:incCats(),expenseCats:expCats(),work:work()};Object.assign(data,patch);try{await E.doc("config/main").set(data);return true}catch(err){dbErr(err);return false}}
async function saveTx(form){
  const g=id=>{const el=document.getElementById(id);return el?el.value.trim():""};
  const admin=fullForm();const kind=admin?S.kind:"expense";
  const amount=parseFloat(g("f_amount"));
  if(!(amount>0))return toast("اكتب مبلغ صحيح");
  const data={kind,date:g("f_date")||today(),amount:Math.round(amount*100)/100,note:g("f_note"),
    category:(kind==="income"||kind==="expense")?g("f_cat"):"",source:kind==="income"?g("f_source"):"",
    personId:admin?(kind==="income"?"":g("f_person")):S.me};
  if((kind==="custody"||kind==="return")&&!data.personId)return toast("اختار الموظف");
  if(kind==="expense"&&isSal(data.category)){data.empId=g("f_emp");data.salMonth=g("f_month");if(!data.empId||!data.salMonth)return toast("اختار الموظف والشهر")}
  else{data.empId="";data.salMonth=""}
  const btn=document.getElementById("f_submit");btn.disabled=true;
  if(S.staffMode){try{await putItem({t:"expense",date:data.date,amount:data.amount,category:data.category,note:data.note,empId:data.empId,salMonth:data.salMonth});
    document.getElementById("f_amount").value="";document.getElementById("f_note").value="";toast("اتسجّل، وهيتراجع من الإدارة")}catch(err){dbErr(err)}finally{btn.disabled=false}return}
  try{
    if(S.editing){await E.collection("tx").doc(S.editing).update(Object.assign(data,{updatedAt:new Date().toISOString(),updatedBy:S.me}));S.editing=null;toast("اتعدّلت الحركة");S.view=admin?"ledger":S.view;go();return}
    await E.collection("tx").add(Object.assign(data,{createdBy:S.me,createdAt:new Date().toISOString()}));
    document.getElementById("f_amount").value="";document.getElementById("f_note").value="";const src=document.getElementById("f_source");if(src)src.value="";
    toast(kind==="custody"?"العهدة اتسجلت على "+pname(data.personId):"اتسجّلت");
    document.getElementById("f_amount").focus();
  }catch(err){dbErr(err)}finally{const b2=document.getElementById("f_submit");if(b2)b2.disabled=false}
}
async function exportCSV(){
  if(!S.downloads)return;
  const cell=v=>{v=String(v??"");return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const rows=[["التاريخ","النوع","البند","المبلغ","الشخص","المصدر","ملاحظات","أثر على الخزنة","سجّلها"]].concat(
    sortTx(filtered(),true).map(t=>[t.date,KIND[t.kind],t.category,t.amount,t.personId?pname(t.personId):(t.kind==="expense"?"الخزنة":""),t.source,t.note,effect(t),pname(t.createdBy)]));
  const csv="﻿"+rows.map(r=>r.map(cell).join(",")).join("\r\n");
  try{await S.downloads.save({filename:"دفتر-الخزنة-"+(S.lf.month||"كل-الفترات")+".csv",data:csv})}catch(err){if(err&&err.code!=="declined")toast("التنزيل ما تمّش")}
}
boot();
})();
