<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAWA UNITED GROUP | مجموعة سوا يونيتد</title>
<meta name="description" content="SAWA UNITED Group – Car Rental, Food Supplies, Real Estate, Petroleum Products. مجموعة سوا يونيتد – تأجير سيارات، مواد غذائية، عقارات، مشتقات بترول.">
<meta name="theme-color" content="#07090D">
<meta property="og:title" content="SAWA UNITED GROUP">
<meta property="og:description" content="Car Rental · Food · Real Estate · Petroleum">
<meta property="og:image" content="https://sawaunited.net/assets/sawa-header-logo.png">
<link rel="icon" href="assets/sawa-header-logo.png">
<script>
/* apply saved theme before paint (no flash) */
(function(){try{var t=localStorage.getItem("sawa_theme");if(!t)t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.setAttribute("data-theme",t);}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">

<style>
@property --acc{syntax:'<color>';inherits:true;initial-value:#F26B3A}
:root{
  --car:#F26B3A; --food:#22A45D; --estate:#D4A033; --oil:#2F7BEA;
  --r:26px; --ease:cubic-bezier(.23,1,.32,1);
  --font:'Cairo',system-ui,sans-serif;
}
html[lang=en],html[lang=fr]{--font:'Manrope','Cairo',system-ui,sans-serif}
[data-theme=dark]{
  --bg:#06070A; --bg2:#0A0D14; --surface:#0F141C; --surface2:#131924;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.14);
  --ink:#F2F5F9; --muted:#8FA0B2; --gold:#E3B85A; --gold-ink:#080A0F;
  --grid:rgba(255,255,255,.035); --shadow:0 40px 90px -40px rgba(0,0,0,.9);
  --glass:rgba(6,7,10,.68); --glass-border:rgba(255,255,255,.09);
}
[data-theme=light]{
  --bg:#F7F5F0; --bg2:#EFECE4; --surface:#FFFFFF; --surface2:#F8F6F2;
  --line:rgba(11,15,20,.07); --line2:rgba(11,15,20,.15);
  --ink:#0A0D14; --muted:#555F6C; --gold:#A97A12; --gold-ink:#FFFFFF;
  --grid:rgba(11,15,20,.045); --shadow:0 40px 90px -38px rgba(40,30,10,.3);
  --glass:rgba(247,245,240,.75); --glass-border:rgba(11,15,20,.1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--font);font-weight:700;background:var(--bg);color:var(--ink);line-height:1.6;overflow-x:hidden;transition:background-color .4s,color .4s}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img,svg{display:block}
.wrap{width:100%;max-width:1240px;margin:0 auto;padding:0 20px}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:10px}

/* ---------- progress + header ---------- */
#progress{position:fixed;top:0;inset-inline-start:0;height:3px;width:0;background:linear-gradient(90deg,var(--car),var(--food),var(--estate),var(--oil));z-index:100}
header{position:fixed;top:0;left:0;right:0;z-index:90;transition:background .4s,border-color .4s,backdrop-filter .4s,border-radius .4s;border-bottom:1px solid transparent}
header.solid{background:var(--glass);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border-color:var(--glass-border)}
.bar{display:flex;align-items:center;gap:14px;height:76px}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand .chip{background:#0B0F14;border-radius:14px;padding:6px 10px;display:flex;align-items:center;min-height:46px}
[data-theme=dark] .brand .chip{background:transparent;padding:0}
.brand img{height:40px;width:auto}
.wordmark{display:none;font-weight:900;font-size:19px;letter-spacing:.06em;color:#fff;white-space:nowrap}
.wordmark i{font-style:normal;color:#DDAE45}
nav.main{display:flex;gap:4px;margin-inline-start:auto}
nav.main a{font-size:15.5px;font-weight:800;color:var(--muted);padding:8px 14px;border-radius:999px;transition:color .2s,background .2s}
nav.main a:hover{color:var(--ink);background:var(--line)}
.tools{display:flex;align-items:center;gap:8px}
nav.main + .tools{margin-inline-start:6px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{font-size:14px;font-weight:800;color:var(--muted);border-radius:999px;padding:6px 12px;min-width:42px;transition:.25s var(--ease)}
.seg button.on{background:var(--ink);color:var(--bg)}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);transition:transform .3s var(--ease),background .3s}
.icon-btn:hover{transform:rotate(18deg)}
.icon-btn svg{width:21px;height:21px}
.theme .sun{display:none}[data-theme=dark] .theme .sun{display:block}[data-theme=dark] .theme .moon{display:none}
.cta-mini{display:inline-flex;align-items:center;gap:8px;background:var(--gold);color:var(--gold-ink);font-weight:900;font-size:15px;padding:11px 18px;border-radius:999px;transition:transform .25s var(--ease),box-shadow .25s}
.cta-mini:hover{transform:translateY(-2px);box-shadow:0 10px 26px -10px var(--gold)}
.cta-mini svg{width:18px;height:18px}


/* ---------- HERO ---------- */
.hero{position:relative;min-height:100vh;min-height:100svh;padding:110px 0 50px;display:flex;align-items:center;overflow:hidden;transition:--acc .8s}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse 80% 70% at 50% 40%,#000 30%,transparent 80%);-webkit-mask-image:radial-gradient(ellipse 80% 70% at 50% 40%,#000 30%,transparent 80%)}
.glow{position:absolute;width:780px;height:780px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--acc) 38%,transparent),transparent 65%);top:-260px;inset-inline-end:-200px;filter:blur(20px);opacity:.9;pointer-events:none}
.spot{position:absolute;inset:0;background:radial-gradient(500px circle at var(--mx,50%) var(--my,40%),color-mix(in srgb,var(--acc) 12%,transparent),transparent 60%);pointer-events:none}
.hero-grid{position:relative;display:grid;grid-template-columns:1.02fr 1fr;gap:56px;align-items:center;width:100%}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line2);padding:7px 16px 7px 12px;border-radius:999px;background:var(--surface)}
html[lang=ar] .eyebrow{letter-spacing:0}
.eyebrow b{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 25%,transparent);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--acc) 0%,transparent)}}
h1{font-size:clamp(36px,4.9vw,64px);font-weight:900;line-height:1.12;letter-spacing:-.02em;margin:22px 0 18px}
html[lang=ar] h1{letter-spacing:0;line-height:1.3}
h1 em{font-style:normal;background:linear-gradient(100deg,var(--acc),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:clamp(17px,1.6vw,20px);color:var(--muted);max-width:560px;font-weight:600}
.choose{margin:34px 0 14px;font-size:14px;font-weight:800;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;gap:12px}
html[lang=ar] .choose{letter-spacing:0;font-size:16px}
.choose::after{content:"";flex:1;height:1px;background:var(--line2)}

.tabs{display:flex;flex-direction:column;gap:10px;width:100%;max-width:none}
.tab{--c:var(--car);position:relative;display:flex;align-items:center;gap:12px;width:100%;max-width:none;padding:16px 18px;border-radius:20px;background:var(--surface);border:1px solid var(--line);text-align:start;overflow:hidden;transition:border-color .3s var(--ease),transform .3s var(--ease),background .3s var(--ease),box-shadow .3s var(--ease);box-sizing:border-box}
.tab::before{content:"";position:absolute;inset:0;border-radius:20px;padding:1px;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 40%,transparent));-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:destination-out;mask-composite:exclude;opacity:0;transition:opacity .3s var(--ease)}
.tab:hover{border-color:color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 6%,var(--surface));transform:translateY(-2px)}
.tab:hover::before{opacity:1}
.tab:active{transform:translateY(0);scale:.985}
.tab.active{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface));box-shadow:0 10px 30px -10px color-mix(in srgb,var(--c) 35%,transparent)}
.tab.active::before{opacity:1}
.tab .ti{width:48px;height:48px;flex-shrink:0;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);transition:.3s var(--ease);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 25%,transparent)}
.tab.active .ti{background:var(--c);color:#fff;box-shadow:0 8px 24px -8px var(--c)}
.tab .ti svg{width:26px;height:26px}
.tab strong{display:block;font-size:17px;font-weight:900;line-height:1.3}
.tab small{display:inline-block;font-size:13px;color:var(--muted);direction:ltr;unicode-bidi:isolate;text-align:start;font-family:'Manrope',sans-serif}
.tab .bar-p{position:absolute;bottom:0;inset-inline-start:0;height:3px;width:0;background:var(--c)}
.tab.active .bar-p{animation:fillp 6.5s linear forwards}
.hero.paused .tab.active .bar-p{animation-play-state:paused}
.hero.manual .tab.active .bar-p{animation:none;width:100%}
@keyframes fillp{to{width:100%}}

/* stage */
.stage{position:relative;aspect-ratio:4/4.5;border-radius:36px;overflow:hidden;box-shadow:var(--shadow);transform:perspective(1200px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .5s var(--ease);background:#05070A;isolation:isolate;border:1px solid var(--line)}
.layer{position:absolute;inset:0;opacity:0;transform:scale(1.08);transition:opacity .9s var(--ease),transform 1.6s var(--ease)}
.layer.on{opacity:1;transform:scale(1)}
.art{position:absolute;inset:0;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 62%,#05070A),#05070A 78%)}
.art svg{position:absolute;inset:0;width:100%;height:100%}
.art .photo{position:absolute;inset:0;background-size:cover;background-position:center}
.stage::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,7,10,0) 35%,rgba(5,7,10,.88) 100%);z-index:1;pointer-events:none}
.stage-top{position:absolute;top:20px;inset-inline:20px;display:flex;justify-content:space-between;align-items:center;z-index:2;color:#fff}
.pill{font-size:13px;font-weight:800;background:rgba(255,255,255,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:6px 14px;font-family:'Manrope',sans-serif;direction:ltr}
.stage-body{position:absolute;bottom:0;inset-inline:0;padding:28px;z-index:2;color:#fff}
.stage-body .k{font-size:14px;font-weight:800;color:rgba(255,255,255,.7);margin-bottom:4px}
.stage-body h2{font-size:clamp(28px,3.2vw,42px);font-weight:900;line-height:1.2}
.stage-body p{color:rgba(255,255,255,.78);font-size:16px;margin:8px 0 18px;max-width:440px;font-weight:600}
.fade{animation:fadeup .6s var(--ease)}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-weight:900;font-size:16.5px;border-radius:999px;padding:14px 26px;transition:transform .2s var(--ease),box-shadow .25s,background .2s,border-color .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 32px -12px color-mix(in srgb,var(--acc) 45%,transparent)}
.btn:active{transform:translateY(0);scale:.97}
.btn svg{width:20px;height:20px;transition:transform .2s var(--ease)}
.btn:hover svg.arr{transform:translateX(4px)}
[dir=rtl] svg.arr{transform:scaleX(-1)}
[dir=rtl] .btn:hover svg.arr{transform:scaleX(-1) translateX(4px)}
.btn-acc{background:var(--acc);color:#fff;box-shadow:0 14px 34px -14px var(--acc)}
.btn-white{background:#fff;color:#0A0D14}
.btn-line{border:1.5px solid var(--line2);color:var(--ink)}
.btn-line:hover{border-color:var(--ink);background:rgba(255,255,255,.03)}
.btn-wa{background:#25D366;color:#06230F;box-shadow:0 12px 28px -10px rgba(37,211,102,.45)}
.scroll-hint{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:26px;height:42px;border:2px solid var(--line2);border-radius:20px}
.scroll-hint::after{content:"";position:absolute;top:8px;left:50%;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:var(--muted);animation:sh 1.8s infinite}
@keyframes sh{60%{transform:translateY(12px);opacity:0}}

/* ---------- marquee ---------- */
.marquee{border-block:1px solid var(--line);background:var(--bg2);overflow:hidden;padding:20px 0;direction:ltr}
.track{display:flex;width:max-content;animation:mq 38s linear infinite}
.marquee:hover .track{animation-play-state:paused}
.track span{display:flex;align-items:center;gap:26px;padding-inline:26px;font-size:clamp(22px,3vw,34px);font-weight:900;white-space:nowrap;color:var(--ink)}
.track span i{width:12px;height:12px;border-radius:50%;display:inline-block}
.track span.o{color:transparent;-webkit-text-stroke:1.3px var(--muted)}
html[lang=ar] .track span.o{color:var(--muted);-webkit-text-stroke:0}
@keyframes mq{to{transform:translateX(-50%)}}

/* ---------- sections ---------- */
section.sec{padding:110px 0}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;margin-bottom:46px;flex-wrap:wrap}
.kicker{font-size:14px;font-weight:800;color:var(--gold);letter-spacing:.14em;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:10px}
html[lang=ar] .kicker{letter-spacing:0;font-size:16px}
.kicker::before{content:"";width:28px;height:2px;background:var(--gold)}
h3.title{font-size:clamp(30px,4.2vw,52px);font-weight:900;line-height:1.18;letter-spacing:-.015em;max-width:720px}
html[lang=ar] h3.title{letter-spacing:0;line-height:1.35}
.sec-head p{color:var(--muted);max-width:420px;font-size:17px;font-weight:600}

/* panels */
.panels{display:flex;gap:14px;height:600px}
.panel{--c:var(--car);position:relative;flex:1;border-radius:var(--r);overflow:hidden;cursor:pointer;transition:flex 0.8s var(--ease);background:#05070A;min-width:0;isolation:isolate;border:1px solid var(--line)}
.panel.active{flex:3.5}
.panel .art{transition:transform 1.4s var(--ease)}
.panel:hover .art{transform:scale(1.03)}
.panel::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,7,10,.08) 25%,rgba(5,7,10,.94) 100%);z-index:1}
.p-in{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;padding:30px;color:#fff}
.p-num{position:absolute;top:22px;inset-inline-start:24px;font-family:'Manrope',sans-serif;font-weight:800;font-size:15px;color:rgba(255,255,255,.75)}
.p-ico{width:54px;height:54px;border-radius:16px;background:var(--c);display:grid;place-items:center;margin-bottom:14px;box-shadow:0 10px 30px -8px var(--c)}
.p-ico svg{width:28px;height:28px;color:#fff}
.panel h4{font-size:clamp(21px,2vw,30px);font-weight:900;line-height:1.25}
.p-dom{display:inline-block;font-family:'Manrope',sans-serif;font-size:14px;color:rgba(255,255,255,.7);direction:ltr;unicode-bidi:isolate;font-weight:700}
.p-more{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .7s var(--ease),opacity .5s}
.panel.active .p-more{grid-template-rows:1fr;opacity:1;transition-delay:.15s}
.p-more>div{overflow:hidden;min-width:300px}
.p-more p{color:rgba(255,255,255,.82);font-size:16.5px;margin:12px 0 14px;max-width:520px;font-weight:600}
.p-more ul{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.p-more li{font-size:14px;font-weight:800;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:6px 14px;border-radius:999px;backdrop-filter:blur(6px)}
.p-more .btn{background:var(--c);color:#fff}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.stat{padding:38px 26px;position:relative}
.stat+.stat{border-inline-start:1px solid var(--line)}
.stat b{display:inline-flex;align-items:flex-start;font-family:'Manrope',sans-serif;font-size:clamp(38px,4.6vw,60px);font-weight:800;line-height:1;letter-spacing:-.03em;direction:ltr;text-align:start}
.stat b sup{font-size:.5em;color:var(--gold);vertical-align:top;margin-inline-start:2px}
.stat>span{display:block;margin-top:10px;color:var(--muted);font-size:16px}

/* why */
.why{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.card{position:relative;grid-column:span 2;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:32px 28px;overflow:hidden;transition:transform .4s var(--ease),border-color .3s,box-shadow .3s var(--ease)}
.card:nth-child(4),.card:nth-child(5){grid-column:span 3}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(500px circle at var(--x,50%) var(--y,50%),color-mix(in srgb,var(--gold) 20%,transparent),transparent 65%);opacity:0;transition:opacity .4s var(--ease)}
.card:hover{transform:translateY(-6px);border-color:var(--line2);box-shadow:0 20px 50px -15px rgba(0,0,0,.6)}
.card:hover::before{opacity:1}
.card>*{position:relative}
.card .ci{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:color-mix(in srgb,var(--gold) 14%,transparent);color:var(--gold);margin-bottom:22px}
.card .ci svg{width:26px;height:26px}
.card h5{font-size:21px;font-weight:900;margin-bottom:6px;line-height:1.35}
.card p{color:var(--muted);font-size:16px;font-weight:600}

/* presence */
.presence{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center}
.map{position:relative;aspect-ratio:16/11;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);overflow:hidden}
.map svg{width:100%;height:100%}
.map .dot{fill:var(--line2)}
.map .pin{fill:var(--gold);transition:r .3s}
.map .ring{fill:none;stroke:var(--gold);stroke-width:1.5;opacity:.5;transform-box:fill-box;transform-origin:center;animation:ring 2.4s infinite}
@keyframes ring{from{transform:scale(.4);opacity:.8}to{transform:scale(2.2);opacity:0}}
.map .lbl{font-family:var(--font);font-size:20px;font-weight:900;fill:var(--ink);opacity:.85;transition:opacity .3s}
.map g.hl .lbl,.map g:hover .lbl{opacity:1}
.map g.hl .pin{r:12}
.map .pin{r:8}
.countries{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px}
.country{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:17px;font-weight:800;transition:.3s var(--ease);cursor:default}
.country code{font-family:'Manrope',sans-serif;font-size:13px;font-weight:800;background:var(--ink);color:var(--bg);border-radius:8px;padding:4px 8px}
.country:hover,.country.hl{border-color:var(--gold);transform:translateX(4px)}
[dir=rtl] .country:hover,[dir=rtl] .country.hl{transform:translateX(-4px)}

/* CTA */
.cta{position:relative;border-radius:36px;padding:clamp(40px,7vw,90px) clamp(24px,6vw,80px);overflow:hidden;background:#0B0F14;color:#fff;text-align:center;isolation:isolate}
.cta::before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,var(--car),var(--food),var(--estate),var(--oil),var(--car));opacity:.35;filter:blur(80px);animation:spin 18s linear infinite;z-index:-1}
@keyframes spin{to{transform:rotate(360deg)}}
.cta h3{font-size:clamp(32px,5vw,62px);font-weight:900;line-height:1.15}
.cta p{color:rgba(255,255,255,.75);font-size:18px;max-width:560px;margin:16px auto 30px;font-weight:600}
.cta .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.cta .btn-line{color:#fff;border-color:rgba(255,255,255,.35)}

/* footer */
footer{padding:70px 0 calc(30px + env(safe-area-inset-bottom));border-top:1px solid var(--line);margin-top:110px;background:var(--bg2)}
.f-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:30px}
.f-grid h6{font-size:14px;color:var(--muted);font-weight:800;margin-bottom:14px;letter-spacing:.1em;text-transform:uppercase}
html[lang=ar] .f-grid h6{letter-spacing:0;font-size:15px}
.f-grid a{display:block;padding:5px 0;font-size:16px;transition:color .2s}
.f-grid a:hover{color:var(--gold)}
.f-tag{color:var(--muted);margin-top:14px;max-width:300px;font-weight:600}
.f-bot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:50px;padding-top:24px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}

.fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));inset-inline-start:20px;width:60px;height:60px;border-radius:50%;background:#25D366;display:grid;place-items:center;box-shadow:0 12px 30px -8px rgba(37,211,102,.6);z-index:80;transition:transform .3s var(--ease)}
.fab:hover{transform:scale(1.08)}
.fab svg{width:32px;height:32px;fill:#fff}
.fab::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #25D366;animation:ring 2.4s infinite}

/* reveal */
.rv{opacity:0;transform:translateY(34px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}

/* ---------- responsive ---------- */
@media (max-width:1080px){
  nav.main{display:none}

  .panel,.panel.active{flex:none}

  .panel.active{height:470px}
  .p-in{padding:20px}

/* map coordinates (simple projection on a 800x550 canvas) */
const COUNTRIES = [{k:"MA",x:250,y:250},{k:"SA",x:520,y:300},{k:"AE",x:600,y:300},{k:"KW",x:555,y:240}];

let L="ar", cur=0;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const pad=n=>String(n).padStart(2,"0");

/* ---------- build static structure once ---------- */
function artHTML(s,fit){const svg=fit?ART[s.id].replace('xMidYMid slice','xMidYMin meet'):ART[s.id];return `<div class="art" style="--c:${s.c}">${svg}${s.photo?`<div class="photo" style="background-image:url('${s.photo}')"></div>`:""}</div>`}
$("#layers").innerHTML = SECTORS.map((s,i)=>`<div class="layer${i===0?" on":""}">${artHTML(s,true)}</div>`).join("");
$("#tabs").innerHTML = SECTORS.map((s,i)=>`<button class="tab${i===0?" active":""}" role="tab" style="--c:${s.c}" data-i="${i}"><span class="ti">${ICON[s.id]}</span><span><strong></strong><small>${s.dom}</small></span><span class="bar-p"></span></button>`).join("");
$("#panels").innerHTML = SECTORS.map((s,i)=>`<div class="panel${i===0?" active":""}" style="--c:${s.c}" data-i="${i}" tabindex="0">${artHTML(s)}<div class="p-in"><span class="p-num">${pad(i+1)}</span><div class="p-head"><span class="p-ico">${ICON[s.id]}</span><div><h4></h4><div class="p-dom">${s.dom}</div></div></div><div class="p-more"><div><p></p><ul></ul><a class="btn" href="${s.url}"><span></span>${ICON.arr}</a></div></div></div></div>`).join("");
$("#map").innerHTML = buildMap();

function buildMap(){
  /* dotted world-ish backdrop limited to Africa / Middle East region */
  let dots="";
  for(let x=24;x<800;x+=20)for(let y=24;y<540;y+=20){
    const v=Math.sin(x*.021)+Math.cos(y*.027)+Math.sin((x+y)*.011);
    if(v>-.2) dots+=`<circle class="dot" cx="${x}" cy="${y}" r="${v>1.2?3:2.4}"/>`;
  }
  const pins=COUNTRIES.map(c=>`<g data-k="${c.k}"><circle class="ring" cx="${c.x}" cy="${c.y}" r="10"/><circle class="pin" cx="${c.x}" cy="${c.y}" r="6"/><text class="lbl" x="${c.x}" y="${c.y-18}" text-anchor="middle"></text></g>`).join("");
  return `<svg viewBox="0 0 800 550" preserveAspectRatio="xMidYMid slice">${dots}<path d="M250 250Q400 180 520 300M520 300Q560 280 600 300M520 300Q530 260 555 240" fill="none" stroke="var(--gold)" stroke-width="1.6" stroke-dasharray="5 6" opacity=".7"/>${pins}</svg>`;
}

/* ---------- language ---------- */
function setLang(l){
  if(!T[l]) l="ar"; L=l; const d=T[l];
  document.documentElement.lang=l; document.documentElement.dir=l==="ar"?"rtl":"ltr";
  $$("[data-t]").forEach(el=>{const v=d[el.dataset.t]; if(typeof v==="string") el.innerHTML=v;});
  $$(".seg button").forEach(b=>b.classList.toggle("on",b.dataset.l===l));
  $$(".tab").forEach((t,i)=>t.querySelector("strong").textContent=d[SECTORS[i].id].n);
  $$(".panel").forEach((p,i)=>{const s=d[SECTORS[i].id];p.querySelector("h4").textContent=s.n;p.querySelector(".p-more p").textContent=s.d;p.querySelector("ul").innerHTML=s.f.map(x=>`<li>${x}</li>`).join("");p.querySelector(".btn span").textContent=d.visit;});
  $("#why").innerHTML=d.why.map((w,i)=>`<div class="card rv in"><div class="ci">${WHY_ICONS[i]}</div><h5>${w[0]}</h5><p>${w[1]}</p></div>`).join("");
  $("#countries").innerHTML=COUNTRIES.map(c=>`<div class="country" data-k="${c.k}"><code>${c.k}</code>${d.cty[c.k]}</div>`).join("");
  $$("#map g[data-k]").forEach(g=>g.querySelector("text").textContent=d.cty[g.dataset.k]);
  $("#fSectors").innerHTML=SECTORS.map(s=>`<a href="${s.url}">${d[s.id].n}</a>`).join("");
  const words=SECTORS.map((s,i)=>`<span class="${i%2?"o":""}"><i style="background:${s.c}"></i>${d[s.id].n}</span>`).join("");
  $("#track").innerHTML=words+words+words+words;
  bindDynamic(); show(cur,true);
  try{localStorage.setItem("sawa_lang",l)}catch(e){}
  try{const u=new URL(location.href);u.searchParams.set("lang",l);history.replaceState(null,"",u)}catch(e){}
}

/* ---------- hero showcase ---------- */
function show(i,silent){
  cur=i; const s=SECTORS[i], d=T[L][s.id];
  $("#hero").style.setProperty("--acc",s.c);
  $$(".layer").forEach((el,k)=>el.classList.toggle("on",k===i));
  $$(".tab").forEach((t,k)=>{t.classList.toggle("active",k===i);t.setAttribute("aria-selected",k===i)});
  $("#stNum").textContent=`${pad(i+1)} / ${pad(SECTORS.length)}`;
  $("#stDom").textContent=s.dom;
  $("#stBody").innerHTML=`<div class="fade"><div class="k">${d.s}</div><h2>${d.n}</h2><p>${d.d}</p><a class="btn btn-white" href="${s.url}">${T[L].visit} ${ICON.arr}</a></div>`;
  /* restart progress animation */
  const bp=$$(".tab")[i].querySelector(".bar-p"); bp.style.animation="none"; bp.offsetWidth; bp.style.animation="";
}
$("#tabs").addEventListener("click",e=>{const t=e.target.closest(".tab"); if(!t) return; const i=+t.dataset.i; location.href=SECTORS[i].url;});
$("#tabs").addEventListener("animationend",e=>{ if(e.animationName==="fillp" && !$("#hero").classList.contains("manual")) show((cur+1)%SECTORS.length);});
const hero=$("#hero"), stage=$("#stage");
stage.addEventListener("mouseenter",()=>hero.classList.add("paused"));
stage.addEventListener("mouseleave",()=>{hero.classList.remove("paused");stage.style.setProperty("--rx","0deg");stage.style.setProperty("--ry","0deg")});
if(matchMedia("(pointer:fine)").matches){
  stage.addEventListener("pointermove",e=>{const r=stage.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;stage.style.setProperty("--ry",(x*8)+"deg");stage.style.setProperty("--rx",(-y*8)+"deg")});
  hero.addEventListener("pointermove",e=>{const r=hero.getBoundingClientRect();hero.style.setProperty("--mx",(e.clientX-r.left)+"px");hero.style.setProperty("--my",(e.clientY-r.top)+"px")});
}

/* ---------- panels ---------- */
function activatePanel(p){$$(".panel").forEach(x=>x.classList.toggle("active",x===p))}
$("#panels").addEventListener("click",e=>{const p=e.target.closest(".panel"); if(p && !e.target.closest("a")) activatePanel(p);});
$("#panels").addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("panel")){e.preventDefault();activatePanel(e.target)}});
if(matchMedia("(hover:hover) and (min-width:1081px)").matches) $$(".panel").forEach(p=>p.addEventListener("mouseenter",()=>activatePanel(p)));

/* ---------- dynamic bits (rebuilt on language change) ---------- */
function bindDynamic(){
  $$(".card").forEach(c=>c.addEventListener("pointermove",e=>{const r=c.getBoundingClientRect();c.style.setProperty("--x",(e.clientX-r.left)+"px");c.style.setProperty("--y",(e.clientY-r.top)+"px")}));
  const hl=(k,on)=>{$$(`[data-k="${k}"]`).forEach(x=>x.classList.toggle("hl",on))};
  $$(".country").forEach(c=>{c.addEventListener("mouseenter",()=>hl(c.dataset.k,true));c.addEventListener("mouseleave",()=>hl(c.dataset.k,false))});
  $$("#map g[data-k]").forEach(g=>{g.addEventListener("mouseenter",()=>hl(g.dataset.k,true));g.addEventListener("mouseleave",()=>hl(g.dataset.k,false))});
}

/* ---------- theme ---------- */
$$(".theme").forEach(b=>b.addEventListener("click",()=>{
  const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";
  document.documentElement.setAttribute("data-theme",t);
  document.querySelector('meta[name=theme-color]').setAttribute("content",t==="dark"?"#07090D":"#F6F4EF");
  try{localStorage.setItem("sawa_theme",t)}catch(e){}
}));

/* ---------- language buttons ---------- */
$$(".seg button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.l)));

/* ---------- header + progress ---------- */
const hdr=$("#hdr"), prog=$("#progress");
addEventListener("scroll",()=>{const y=scrollY;hdr.classList.toggle("solid",y>20);prog.style.width=(y/(document.documentElement.scrollHeight-innerHeight)*100)+"%"},{passive:true});

/* ---------- reveal + counters ---------- */
const io=("IntersectionObserver" in window)?new IntersectionObserver(es=>es.forEach(e=>{
  if(!e.isIntersecting) return; e.target.classList.add("in"); io.unobserve(e.target);
  e.target.querySelectorAll(".cnt").forEach(c=>{const to=+c.dataset.to,t0=performance.now(),dur=1600;
    const step=t=>{const p=Math.min(1,(t-t0)/dur),v=Math.round(to*(1-Math.pow(1-p,3)));c.textContent=v.toLocaleString("en-US");if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step)});
}),{threshold:.15}):null;
$$(".rv").forEach(el=>io?io.observe(el):el.classList.add("in"));
if(!io) $$(".cnt").forEach(c=>c.textContent=(+c.dataset.to).toLocaleString("en-US"));

/* ---------- start ---------- */
let start="ar";
try{const q=new URLSearchParams(location.search).get("lang"),s=localStorage.getItem("sawa_lang"),n=(navigator.language||"").slice(0,2);start=q||s||(n==="fr"?"fr":n==="en"?"en":"ar")}catch(e){}
setLang(start);
</script>
