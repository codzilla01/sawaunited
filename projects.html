<script src="js/ecosystem-store.js"></script>
<script>
(function () {
  "use strict";
  var S = window.SAWAStore;
  var lang = S.lang();
  function $(s) { return document.querySelector(s); }
  function esc(v) {
    return String(v === null || v === undefined ? "" : v).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function ico(name, size) {
    return '<svg width="' + (size || 16) + '" height="' + (size || 16) + '" aria-hidden="true"><use href="#i-' + name + '"/></svg>';
  }
  var ICONS = { realestate: "building", food: "leaf", cars: "car", energy: "fuel", logistics: "ship" };
  var filter = "all";

  function paintStatic() {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"), function (node) {
      node.textContent = S.t(node.getAttribute("data-i18n"));
    });
    Array.prototype.forEach.call(document.querySelectorAll(".lang-switch button"), function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
    });
    var c = S.data.content;
    document.title = S.pick(c.seoTitle, lang);
    var meta = document.querySelector('meta[name="description"]');
    if (meta) meta.setAttribute("content", S.pick(c.seoDescription, lang));
    $("#copyYear").textContent = String(new Date().getFullYear());
  }

  function renderChips() {
    var items = [{ id: "all", label: S.t("all") }].concat(S.data.sectors.map(function (s) {
      return { id: s.id, label: S.pick(s.short, lang) };
    }));
    $("#platformChips").innerHTML = items.map(function (it) {
      return '<button type="button" class="chip" data-id="' + esc(it.id) + '" aria-pressed="' + (filter === it.id) + '">' + esc(it.label) + '</button>';
    }).join("");
    Array.prototype.forEach.call(document.querySelectorAll("#platformChips .chip"), function (btn) {
      btn.addEventListener("click", function () { filter = btn.dataset.id; renderChips(); renderGrid(); });
    });
  }

  function renderGrid() {
    var list = S.data.sectors.filter(function (s) { return filter === "all" || s.id === filter; });
    $("#platformCount").textContent = String(list.length);
    $("#platformGrid").innerHTML = list.map(function (s) {
      var props = s.id === "realestate" ? S.data.properties.filter(function (p) { return p.status === "available"; }).length + " " + (lang === "ar" ? "وحدة متاحة" : "available units") : "";
      return '<article class="prop-card" data-sector="' + esc(s.id) + '">' +
        '<div class="prop-media">' +
          '<img src="' + esc(s.image) + '" alt="' + esc(S.pick(s.name, lang)) + '" loading="lazy" decoding="async" width="800" height="500">' +
          '<span class="prop-status" data-status="available" style="background:rgba(212,175,55,.16);color:#F1D488;border:1px solid rgba(212,175,55,.32)" dir="ltr">' + esc(s.no) + ' / 05</span>' +
        '</div>' +
        '<div class="prop-body">' +
          '<span class="prop-city" dir="ltr">' + esc(s.domain) + '</span>' +
          '<h2 class="prop-title">' + esc(S.pick(s.name, lang)) + '</h2>' +
          '<p style="font-size:12.4px;color:var(--muted);line-height:1.7">' + esc(S.pick(s.desc, lang)) + '</p>' +
          '<div class="prop-specs">' + s.stats.map(function (st) {
            return '<span><b style="color:#fff;font-family:var(--font-en)" dir="ltr">' + esc(st.value) + '</b> ' + esc(S.pick(st.label, lang)) + '</span>';
          }).join("") + '</div>' +
          (props ? '<div class="prop-specs" style="color:var(--gold-2)"><span>' + ico("building", 13) + esc(props) + '</span></div>' : "") +
          '<div class="prop-foot">' +
            '<a class="btn btn--gold btn--sm" href="index.html#' + esc(s.id) + '">' + esc(S.t("explore")) + ico("arrow", 14) + '</a>' +
            '<a class="btn btn--ghost btn--sm" href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer">' + ico(ICONS[s.id] || "doc", 14) + '<span dir="ltr">' + esc(s.domain) + '</span></a>' +
          '</div>' +
        '</div></article>';
    }).join("");
  }

  function boot() {
    paintStatic();
    renderChips();
    renderGrid();
    Array.prototype.forEach.call(document.querySelectorAll(".lang-switch button"), function (btn) {
      btn.addEventListener("click", function () {
        lang = btn.dataset.lang;
        try { localStorage.setItem("sawa_lang", lang); } catch (e) { /* ignore */ }
        paintStatic();
        renderChips();
        renderGrid();
      });
    });
    S.subscribe(function () { if ($("#platformGrid")) { renderGrid(); } });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
